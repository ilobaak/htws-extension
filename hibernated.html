<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hibernated Tabs, Windows, And Sessions</title>
  </head>
  <body>
    <main class="hibernated-shell">
      <header>
        <div>
          <h1>
            Hibernated <span class="archive-color-tab">Tabs</span>,
            <span class="archive-color-window">Windows</span>, And
            <span class="archive-color-session">Sessions</span>
          </h1>
          <p>
            Restore, bookmark, rename, or erase saved tabs, windows, and
            sessions.
          </p>
        </div>
        <strong id="archive-summary" aria-live="polite">Checking</strong>
      </header>
      <div class="page-controls">
        <div class="archive-filter-controls">
          <label for="archive-text-filter">
            Filter by text:
            <input
              id="archive-text-filter"
              type="search"
              placeholder="Name, URL, type, date..."
              autocomplete="off"
            />
          </label>
          <p
            id="archive-filter-results"
            class="archive-filter-results"
            aria-live="polite"
          ></p>
          <button
            id="select-matched"
            type="button"
            disabled
            title="Select entries that directly match the current text filter"
          >
            Select Matched
          </button>
        </div>
        <div class="archive-transfer-actions">
          <button
            id="undo-archive"
            type="button"
            disabled
            title="Undo the most recent archive change"
          >
            <svg
              class="history-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M9 7 4 12l5 5" />
              <path d="M5 12h8a6 6 0 0 1 6 6" />
            </svg>
            Undo
          </button>
          <button
            id="redo-archive"
            type="button"
            disabled
            title="Redo the most recently undone archive change"
          >
            <svg
              class="history-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="m15 7 5 5-5 5" />
              <path d="M19 12h-8a6 6 0 0 0-6 6" />
            </svg>
            Redo
          </button>
          <button
            id="export-archives"
            type="button"
            title="Download all hibernated entries as a JSON backup"
          >
            <svg
              class="transfer-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 15V4" />
              <path d="m8 8 4-4 4 4" />
              <path d="M5 17v3h14v-3" />
            </svg>
            Export
          </button>
          <button
            id="import-archives"
            type="button"
            title="Import hibernated entries from a JSON backup"
          >
            <svg
              class="transfer-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 3v11" />
              <path d="m8 10 4 4 4-4" />
              <path d="M5 17v3h14v-3" />
            </svg>
            Import
          </button>
          <input
            id="archive-import-file"
            type="file"
            accept="application/json,.json"
            hidden
          />
          <button
            id="restore-all"
            type="button"
            disabled
            title="Restore every hibernated tab, window, and session"
          >
            Restore All
          </button>
          <button
            id="clear-archives"
            class="danger-action"
            type="button"
            disabled
            title="Erase every local hibernation entry while keeping saved browser bookmark copies"
          >
            Clear All
          </button>
        </div>
      </div>
      <section class="selection-toolbar" aria-label="Selected archive actions">
        <strong id="selection-summary" aria-live="polite"
          >0 tabs selected</strong
        >
        <div class="selection-actions">
          <button
            id="bookmark-selected"
            type="button"
            disabled
            title="Save permanent browser bookmark copies for the selected entries without removing existing copies"
          >
            <svg
              class="selection-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M7 4h10v16l-5-3-5 3V4Z" />
            </svg>
            Bookmark Selected
          </button>
          <button
            id="merge-selected"
            type="button"
            disabled
            title="Merge selected entries into the first selected entry at the highest hierarchy level"
          >
            Merge Selected
          </button>
          <button
            id="merge-selected-window"
            type="button"
            disabled
            title="Move the selected tabs into a new hibernated window"
          >
            Move To New Window
          </button>
          <button
            id="move-windows-out"
            type="button"
            disabled
            title="Move selected windows out of their sessions"
          >
            Move Windows Out
          </button>
          <button
            id="merge-selected-session"
            type="button"
            disabled
            title="Move the selected tabs and windows into a new hibernated session"
          >
            Move To New Session
          </button>
          <button
            id="move-tabs-to-group"
            type="button"
            disabled
            title="Move selected tabs into a new preserved group"
          >
            Move To New Group
          </button>
          <button
            id="ungroup-tabs"
            type="button"
            disabled
            title="Remove selected tabs from their preserved group"
          >
            Ungroup
          </button>
          <button
            id="move-tabs-out"
            type="button"
            disabled
            title="Move selected nested tabs out as standalone hibernated rows"
          >
            Move Tabs Out
          </button>
          <button
            id="duplicate-selected"
            type="button"
            disabled
            title="Create adjacent copies of the selected hibernated entries"
          >
            Duplicate Selected
          </button>
          <button
            id="restore-selected"
            type="button"
            disabled
            title="Restore the selected hibernated entries"
          >
            <svg
              class="selection-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M3.5 6.5h6l1.75-2h9.25v15H3.5v-13Z" />
              <path d="M3.5 9h17" />
              <path d="M7 6.75h.01M9.5 6.75h.01" />
              <path d="M12.5 6.75h5" />
            </svg>
            Restore Selected
          </button>
          <button
            id="delete-selected"
            class="danger-action"
            type="button"
            disabled
            title="Permanently erase the selected hibernated entries"
          >
            <svg
              class="selection-action-icon selection-action-icon-trash"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M4 6.5h16" />
              <path d="M9 6.5V4h6v2.5" />
              <path d="M6.5 6.5 7.5 20h9l1-13.5" />
              <path d="M10 10v6.5M14 10v6.5" />
            </svg>
            Delete Selected
          </button>
          <button
            id="clear-selection"
            type="button"
            disabled
            title="Deselect every selected hibernated entry"
          >
            Clear Selection
          </button>
        </div>
      </section>
      <div id="group-creator" class="group-creator" popover>
        <form id="group-creator-form">
          <div class="group-creator-heading">
            <strong>Move To New Group</strong>
            <button
              id="cancel-group-creator"
              class="group-creator-close"
              type="button"
              aria-label="Cancel group creation"
              title="Cancel"
            >
              &times;
            </button>
          </div>
          <label for="group-creator-name">Name</label>
          <input
            id="group-creator-name"
            maxlength="80"
            required
            value="Group"
          />
          <fieldset>
            <legend>Color</legend>
            <details
              id="group-creator-color-dropdown"
              class="archive-group-color-dropdown group-creator-color-dropdown"
            >
              <summary
                class="archive-group-color-trigger"
                title="Choose group color"
                aria-label="Choose group color"
              >
                <span
                  id="group-creator-current-color"
                  class="archive-group-color-current"
                  data-group-color="blue"
                  aria-hidden="true"
                ></span>
              </summary>
              <div
                id="group-creator-colors"
                class="archive-group-color-menu"
                role="radiogroup"
                aria-label="Group color"
              ></div>
            </details>
          </fieldset>
          <button
            class="group-creator-submit"
            type="submit"
            title="Move the selected tabs into a new preserved group with this name and color"
          >
            Move To New Group
          </button>
        </form>
      </div>
      <p id="page-status" class="page-status" role="status"></p>
      <div
        id="archive-root-drop-zone"
        class="archive-root-drop-zone"
        data-drop-root
        role="region"
        aria-label="Move an item out to the top level"
      >
        Drop outside an entry to move it to the top level
      </div>
      <section class="archive-table-shell" aria-label="Hibernated archive">
        <div id="archive-table-head" class="archive-table-head" role="row">
          <span class="selection-heading">
            <input
              id="select-all-archives"
              type="checkbox"
              aria-label="Select all hibernated entries"
            />
          </span>
          <button
            type="button"
            data-sort-key="date"
            aria-sort="descending"
            title="Sort hibernated entries by date"
          >
            Date
            <span
              class="sort-indicator"
              data-direction="descending"
              aria-hidden="true"
            ></span>
          </button>
          <button
            type="button"
            data-sort-key="name"
            aria-sort="none"
            title="Sort hibernated entries by name"
          >
            Name <span class="sort-indicator" aria-hidden="true"></span>
          </button>
          <span class="actions-heading" aria-label="Actions"></span>
          <button
            type="button"
            data-sort-key="type"
            aria-sort="none"
            title="Cycle which entry type is grouped first: Sessions, Windows, Tabs, then Groups"
          >
            Type: <span class="sort-type-marker" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            data-sort-key="bookmarked"
            aria-sort="none"
            title="Sort hibernated entries by bookmark status"
            aria-label="Sort by bookmark status"
          >
            <svg
              class="archive-header-icon archive-bookmark-header-icon archive-bookmark-header-icon-outline"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M7 4h10v16l-5-3-5 3V4Z" />
            </svg>
            <svg
              class="archive-header-icon archive-bookmark-header-icon archive-bookmark-header-icon-filled"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M7 4h10v16l-5-3-5 3V4Z" />
            </svg>
            <span class="sort-indicator" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            data-sort-key="pinned"
            aria-sort="none"
            title="Sort hibernated entries by pin status"
            aria-label="Sort by pin status"
          >
            <svg
              class="archive-header-icon archive-pin-header-icon archive-pin-header-icon-outline"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="m9 4 6 2-2 5 3 4-1 1-5-2-3 4-1-1 3-5-2-4 2-4Z" />
            </svg>
            <svg
              class="archive-header-icon archive-pin-header-icon archive-pin-header-icon-filled"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M8 3h8l-1 6 3 3v2h-5v7l-2-2v-5H6v-2l3-3-1-6Z" />
            </svg>
            <span class="sort-indicator" aria-hidden="true"></span>
          </button>
        </div>
        <p id="archive-empty" class="empty" hidden>
          Nothing is hibernated. Use the popup or tab-strip menu to save tabs
          for later.
        </p>
        <div id="archive-list" class="archive-list"></div>
      </section>
    </main>
    <script type="module" src="/src/hibernated/hibernated.ts"></script>
  </body>
</html>
